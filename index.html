<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotter Lifter Bloodwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: dark gym-floor header, chalk-white work surface. Triage first: stack on top, flags sorted by what caused them. */
:root{
  --bg:#eef0f2; --paper:#ffffff; --ink:#101318; --muted:#5f6b76; --line:#dde2e6; --accent:#1d4ed8; --accent-soft:#e3eafc;
  --bar:#101318; --bar-ink:#f2f4f6;
  --ok:#237a47; --calm:#47657f; --warn:#a16207; --risk:#c2410c; --danger:#b91c1c; --low:#2d66ab;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f13; --paper:#151a20; --ink:#e7ebef; --muted:#97a3ae; --line:#26303a; --accent:#7aa2ff; --accent-soft:#1a2747; --bar:#07090c;
  --ok:#5cc489; --calm:#8fb0cc; --warn:#e3b04b; --risk:#f28b54; --danger:#f26b6b; --low:#79a9ea; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c0f13; --paper:#151a20; --ink:#e7ebef; --muted:#97a3ae; --line:#26303a; --accent:#7aa2ff; --accent-soft:#1a2747; --bar:#07090c;
  --ok:#5cc489; --calm:#8fb0cc; --warn:#e3b04b; --risk:#f28b54; --danger:#f26b6b; --low:#79a9ea; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

header{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:20}
.bar{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.brand{display:flex;align-items:baseline;gap:10px;margin:0}
.brand b{font:700 26px/1 var(--display);letter-spacing:.06em}
.brand span{font-size:13px;color:#9aa6b2}
nav{display:flex;gap:2px;margin-right:auto}
nav a{padding:7px 12px;border-radius:6px;color:#aeb8c2;text-decoration:none;font-weight:600;font-size:15px}
nav a:hover{color:#fff}
nav a[aria-current="page"]{color:#fff;background:#232a33}
.seg{display:inline-flex;background:#1b2128;border-radius:6px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;color:#aeb8c2}
.seg button[aria-pressed="true"]{background:#f2f4f6;color:#101318}
.toggles{display:flex;gap:8px}

main{max-width:1200px;margin:0 auto;padding:24px 20px 40px}
section[data-tab]{display:none}
section[data-tab].on{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--paper);border-radius:12px;padding:22px;box-shadow:0 0 0 1px var(--line)}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h2.sec{font:700 24px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:70ch}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* stack */
.stackhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.stackchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;min-height:34px;align-items:center}
.schip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--bg);font-weight:600;font-size:14px;box-shadow:inset 3px 0 0 var(--c,var(--accent))}
.schip small{font-weight:500;color:var(--muted)}
.schip button{border:0;background:transparent;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.schip button:hover{background:var(--line);color:var(--ink)}
.empty{color:var(--muted);font-size:14px}
.picker{position:relative}
.picker>button{display:inline-flex;gap:8px;align-items:center}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(420px,calc(100vw - 40px));max-height:420px;display:none;flex-direction:column;background:var(--paper);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.18);z-index:30}
.pop.open{display:flex}
.pop input{margin:10px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.pop .opts{overflow:auto;padding:0 6px 8px}
.pop .grp{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 8px 6px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--bg)}
.opt .box{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--muted);margin-top:2px;display:grid;place-items:center;font-size:12px;color:var(--paper)}
.opt[aria-checked="true"] .box{background:var(--accent);box-shadow:none}
.opt strong{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:19px}
.policy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:14px 0 0}

/* counters */
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctr{background:var(--paper);border-radius:12px;padding:14px 16px;box-shadow:0 0 0 1px var(--line);border-top:4px solid var(--c)}
.ctr .n{font:600 32px/1 var(--mono);color:var(--c)}
.ctr .k{font-weight:600;margin-top:6px}
.ctr .d{font-size:13px;color:var(--muted)}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 13%,transparent);font-size:14px}
.notice b{color:var(--warn)}
