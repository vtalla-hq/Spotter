<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotter Lifter Bloodwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: dark gym-floor header, chalk-white work surface. Triage first: stack on top, flags sorted by what caused them. */
:root{
  --bg:#eef0f2; --paper:#ffffff; --ink:#101318; --muted:#5f6b76; --line:#dde2e6; --accent:#1d4ed8; --accent-soft:#e3eafc;
  --bar:#101318; --bar-ink:#f2f4f6;
  --ok:#237a47; --calm:#47657f; --warn:#a16207; --risk:#c2410c; --danger:#b91c1c; --low:#2d66ab;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f13; --paper:#151a20; --ink:#e7ebef; --muted:#97a3ae; --line:#26303a; --accent:#7aa2ff; --accent-soft:#1a2747; --bar:#07090c;
  --ok:#5cc489; --calm:#8fb0cc; --warn:#e3b04b; --risk:#f28b54; --danger:#f26b6b; --low:#79a9ea; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c0f13; --paper:#151a20; --ink:#e7ebef; --muted:#97a3ae; --line:#26303a; --accent:#7aa2ff; --accent-soft:#1a2747; --bar:#07090c;
  --ok:#5cc489; --calm:#8fb0cc; --warn:#e3b04b; --risk:#f28b54; --danger:#f26b6b; --low:#79a9ea; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

header{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:20}
.bar{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px}
.brand{display:flex;align-items:baseline;gap:10px;margin:0}
.brand b{font:700 26px/1 var(--display);letter-spacing:.06em}
.brand span{font-size:13px;color:#9aa6b2}
nav{display:flex;gap:2px;margin-right:auto}
nav a{padding:7px 12px;border-radius:6px;color:#aeb8c2;text-decoration:none;font-weight:600;font-size:15px}
nav a:hover{color:#fff}
nav a[aria-current="page"]{color:#fff;background:#232a33}
.seg{display:inline-flex;background:#1b2128;border-radius:6px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;color:#aeb8c2}
.seg button[aria-pressed="true"]{background:#f2f4f6;color:#101318}
.toggles{display:flex;gap:8px}

main{max-width:1200px;margin:0 auto;padding:24px 20px 40px}
section[data-tab]{display:none}
section[data-tab].on{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--paper);border-radius:12px;padding:22px;box-shadow:0 0 0 1px var(--line)}
.eyebrow{font:700 13px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h2.sec{font:700 24px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px;max-width:70ch}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 13px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* stack */
.stackhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.stackchips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;min-height:34px;align-items:center}
.schip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:999px;background:var(--bg);font-weight:600;font-size:14px;box-shadow:inset 3px 0 0 var(--c,var(--accent))}
.schip small{font-weight:500;color:var(--muted)}
.schip button{border:0;background:transparent;width:24px;height:24px;border-radius:50%;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.schip button:hover{background:var(--line);color:var(--ink)}
.empty{color:var(--muted);font-size:14px}
.picker{position:relative}
.picker>button{display:inline-flex;gap:8px;align-items:center}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(420px,calc(100vw - 40px));max-height:420px;display:none;flex-direction:column;background:var(--paper);border-radius:10px;box-shadow:0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.18);z-index:30}
.pop.open{display:flex}
.pop input{margin:10px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.pop .opts{overflow:auto;padding:0 6px 8px}
.pop .grp{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 8px 6px}
.opt{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:6px;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--bg)}
.opt .box{width:18px;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--muted);margin-top:2px;display:grid;place-items:center;font-size:12px;color:var(--paper)}
.opt[aria-checked="true"] .box{background:var(--accent);box-shadow:none}
.opt strong{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:500;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:19px}
.policy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin:14px 0 0}

/* counters */
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctr{background:var(--paper);border-radius:12px;padding:14px 16px;box-shadow:0 0 0 1px var(--line);border-top:4px solid var(--c)}
.ctr .n{font:600 32px/1 var(--mono);color:var(--c)}
.ctr .k{font-weight:600;margin-top:6px}
.ctr .d{font-size:13px;color:var(--muted)}
.notice{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--warn) 13%,transparent);font-size:14px}
.notice b{color:var(--warn)}

/* triage cards */
.group h2{font:700 20px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 4px;display:flex;align-items:center;gap:10px}
.group h2 i{width:10px;height:10px;border-radius:2px;background:var(--c)}
.group>p{margin:0 0 12px;color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.cards{grid-template-columns:1fr}}
.card{background:var(--paper);border-radius:12px;padding:16px 18px;box-shadow:0 0 0 1px var(--line);border-left:4px solid var(--c)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3{font-size:17px;font-weight:700;margin:0}
.card .val{font:600 15px var(--mono)}
.card .val small{color:var(--muted);font-weight:400}
.card .rng{font-size:12px;color:var(--muted);margin-top:2px}
.card .why{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.card .why li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.tag{font:600 11px/1 var(--mono);padding:4px 7px;border-radius:999px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.card h4{font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.card ul.todo{margin:0;padding-left:18px;font-size:14px}
.card ul.todo li{margin-bottom:4px}
.card .more{margin-top:10px;font-size:13px}
.card .more a{color:var(--accent);font-weight:600;text-decoration:none}
.flagline{font-weight:600;font-size:14px;margin:8px 0 0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.check li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.check li::before{content:"";width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--muted);margin-top:3px}
.watch{display:flex;flex-wrap:wrap;gap:8px}
.watch span{padding:6px 10px;border-radius:8px;background:var(--bg);font-size:14px;font-weight:600}
.watch span small{display:block;font-weight:400;color:var(--muted);font-size:12px}
table.fx{width:100%;border-collapse:collapse;font-size:14px}
.fxwrap{overflow-x:auto}
table.fx th{text-align:left;font:700 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.fx td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.fx td:first-child{font-weight:700;white-space:nowrap}
table.fx td .note{color:var(--muted);font-size:13px;margin-top:4px;max-width:60ch}
.eff{display:inline-flex;gap:4px;align-items:center;margin:0 6px 6px 0;padding:3px 8px;border-radius:6px;font-size:13px;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent)}

/* bloodwork */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.split{grid-template-columns:1fr}}
.list{padding:0;overflow:hidden}
.listhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1 1 200px;padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.ph{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:16px 16px 6px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 100px 120px;gap:12px;align-items:center;padding:9px 16px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--bg)}
.row.sel{background:var(--accent-soft)}
.row .nm strong{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--muted);font-size:12px}
.row .nm small.fxd{color:var(--accent);font-weight:600}
.row input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);font-family:var(--mono);text-align:right}
.row input:placeholder-shown{background:transparent;border-style:dashed}
.row input::placeholder{color:var(--muted);opacity:.6;font:13px var(--sans)}
.row .tag{justify-self:end}
.sheet{position:sticky;top:76px}
@media (max-width:920px){.sheet{position:static}}
.sheet h2{font:700 28px/1.05 var(--display);letter-spacing:.02em;margin:4px 0 0}
.sheet .abbr{color:var(--muted);font:13px var(--mono)}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:14px 0 4px}
.big .v{font:600 34px/1 var(--mono)}
.big .u{color:var(--muted)}
.big .p{font:600 14px var(--mono);color:var(--accent)}
svg.curve{width:100%;height:auto;display:block;margin:8px 0 6px}
svg.curve text{fill:var(--muted);font:11px var(--mono)}
.sheet h3{font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.sheet p,.sheet ul{font-size:14px;margin:0 0 8px;max-width:62ch}
.sheet ul{padding-left:18px}
.sheet li{margin-bottom:5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
a.cite{font:600 10px/1 var(--mono);color:var(--accent);text-decoration:none;vertical-align:super;margin-left:1px}
a.cite:hover{text-decoration:underline}

/* sources */
.prose{max-width:80ch}
.prose p{margin:0 0 12px}
.srclist{list-style:none;padding:0;margin:0}
.srclist li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:12px 6px;border-top:1px solid var(--line);font-size:14px;border-radius:6px}
.srclist li:first-child{border-top:0}
.srclist .n{font:600 13px var(--mono);color:var(--accent)}
.srclist a{color:var(--ink)}
.srclist .used{font-size:12px;color:var(--muted);margin-top:2px}
.srclist li.flash{background:var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){.srclist li{transition:background .6s}}

dialog{border:0;border-radius:12px;background:var(--paper);color:var(--ink);padding:22px;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(5,8,12,.55)}
dialog h2{font:700 24px var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0 0 6px}
dialog textarea{width:100%;min-height:170px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:13px/1.5 var(--mono)}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;align-items:center}
dialog .foot span{margin-right:auto;font-size:13px;color:var(--muted)}
