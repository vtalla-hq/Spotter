# docker compose -f orchestrator/docker-compose.yml up --build
x-app: &app
  build: { context: .., dockerfile: orchestrator/Dockerfile }
  env_file: [{ path: ../.env, required: false }]
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/orchestrator
  depends_on: [redis, postgres]

services:
  redis:
    image: redis:8  # 8+ bundles the JSON and search modules the LangGraph checkpointer needs
    ports: ["6379:6379"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: orchestrator }
    ports: ["5432:5432"]
  api:
    <<: *app
    ports: ["8000:8000"]
  worker:
    <<: *app
    command: celery -A orchestrator.worker worker --loglevel=info
